name: Publish portfolio (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install PDF build dependency
        run: python3 -m pip install --user "pymupdf>=1.24,<2"
      - name: Build portfolio and all public demos
        run: python3 scripts/build_pages.py
      - name: Verify GlassRing appears in generated portfolio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for page in [Path('_site/index.html'), Path('_site/portfolio/index.html'), Path('_site/en/index.html')]:
              content = page.read_text(encoding='utf-8')
              assert 'project-glassring' in content, f'GlassRing assente da {page}'
              assert 'ActionsRingLiquidGlass' in content, f'Link repository assente da {page}'
              print(f'GlassRing OK: {page}')
          PY
      - name: Audit all public pages and local links
        run: |
          python3 scripts/audit_portfolio.py
          python3 scripts/audit_public_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
