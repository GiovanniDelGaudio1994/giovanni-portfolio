<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteo Bash 2D — terminal widget</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:15px;background:#081421;color:#e4f5ff;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{max-width:1030px;margin:auto;border-radius:14px;border:1px solid #356482;background:linear-gradient(140deg,#071724,#10253a);overflow:hidden;box-shadow:0 18px 40px #01081270}.top{height:44px;background:#18314b;border-bottom:1px solid #315976;display:flex;align-items:center;gap:8px;padding:0 16px;color:#b7d1e6}.dot{width:10px;height:10px;border-radius:50%;background:#ff7182}.dot:nth-child(2){background:#ffc96e}.dot:nth-child(3){background:#5edbaa}.top span{margin-left:12px}.body{padding:20px 24px}.prompt{color:#5ce6c3}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.city{font-size:20px;color:#94d9ff;margin:14px 0 0}.temp{font-size:clamp(47px,8vw,84px);font-weight:800;letter-spacing:-4px}.icon{font-size:clamp(65px,12vw,115px);color:#75d7ff;line-height:1}.extra{color:#aac7d9}.forecast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.day{background:#18344a;border:1px solid #33536c;border-radius:9px;padding:10px;min-width:0}button,select{background:#18344a;color:#e6f4fc;border:1px solid #4e728b;border-radius:8px;font:inherit;padding:9px;cursor:pointer}button:hover{background:#24516b}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}.status{font-size:12px;color:#a3c8da;min-height:18px;margin:6px 0 0}.credit{font-size:11px;color:#91b2c5;margin:12px 0 0}a{color:#7fdaff}@media(max-width:510px){body{padding:3px}.body{padding:14px}.forecast{grid-template-columns:1fr}.day{display:flex;justify-content:space-between}.city{font-size:17px}.temp{font-size:57px}}
</style></head><body>
<div class="shell"><div class="top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>giovanni@meteo-bash2d ~ %</span></div>
<div class="body"><div class="toolbar"><label for="place">📍 città: </label><select id="place" aria-label="Seleziona città"><option value="40.6824,14.7681">Salerno</option><option value="41.9028,12.4964">Roma</option><option value="45.4642,9.1900">Milano</option><option value="40.8518,14.2681">Napoli</option><option value="43.7228,10.4017">Pisa</option></select><button id="reload" type="button">↻ aggiorna</button><button id="unit" type="button">°C / °F</button></div><div class="prompt">$ ./MeteoBash2D.sh --live</div><div class="status" id="state" role="status">Connessione al servizio meteo…</div><div class="city" id="city">SALERNO, ITALIA</div><div class="row"><div><div class="temp" id="temp">--°C</div><div id="summary">Caricamento…</div><div class="extra" id="details"></div></div><div class="icon" id="glyph" aria-hidden="true">☁</div></div><div style="margin-top:12px;color:#65e9bc">└─ PREVISIONI / 3 GIORNI</div><div class="forecast" id="days">In attesa dei dati…</div><p class="credit">Dati da <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>. Widget web ispirato al programma Bash originale; non esegue Bash nel browser.</p></div></div>
<script>
(()=>{'use strict';const el=id=>document.getElementById(id);let data=null,imperial=false;const icon=code=>code===0?['☀','Sereno']:code<=3?['☁','Nuvoloso']:code<=48?['≋','Nebbia']:code<=67?['☂','Pioggia']:code<=77?['❄','Neve']:code<=82?['☂','Rovesci']:code<=86?['❄','Neve']:['⚡','Temporale'];const unit=n=>Math.round(imperial?n*1.8+32:n)+'°'+(imperial?'F':'C');let requestNumber=0;function render(){if(!data)return;let c=data.current;el('temp').textContent=unit(c.temperature_2m);const condition=icon(c.weather_code);el('glyph').textContent=condition[0];el('summary').textContent=condition[1];el('details').textContent='Vento '+Math.round(c.wind_speed_10m)+' km/h · Umidità '+c.relative_humidity_2m+'%';const d=data.daily;el('days').replaceChildren(...d.time.slice(0,3).map((date,i)=>{const item=document.createElement('div');item.className='day';const day=document.createElement('strong');day.textContent=new Date(date+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric'});const values=document.createElement('span');values.textContent=icon(d.weather_code[i])[0]+' '+unit(d.temperature_2m_max[i])+' / '+unit(d.temperature_2m_min[i]);item.append(day,values);return item}));}
async function load(){const number=++requestNumber;const select=el('place'),[lat,lon]=select.value.split(',');el('city').textContent=select.selectedOptions[0].text.toUpperCase()+', ITALIA';el('state').textContent='Recupero dati meteo reali…';el('reload').disabled=true;data=null;const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3';try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const payload=await res.json();if(number!==requestNumber)return;if(!payload.current||!payload.daily)throw Error('Risposta incompleta');data=payload;render();el('state').textContent='● LIVE · aggiornato alle '+new Date().toLocaleTimeString('it-IT');}catch(e){if(number!==requestNumber)return;el('state').textContent='⚠ Meteo non disponibile: '+e.message;el('temp').textContent='--°';el('summary').textContent='Riprova più tardi';el('details').textContent='';el('days').textContent='Dati non disponibili';}finally{if(number===requestNumber)el('reload').disabled=false;}}
el('place').addEventListener('change',load);el('reload').addEventListener('click',load);el('unit').addEventListener('click',()=>{imperial=!imperial;render()});load();
})();
</script></body></html>
